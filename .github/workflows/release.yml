name: Release

# Sección 9 del encargo: al crear un tag v*.*.*, construye la imagen multiarquitectura
# (linux/amd64 y linux/arm64) y la sube a Docker Hub.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # DOCKERHUB_REPO es "organizacion/seguimiento-estudiantes": el colegio la define
          # al configurar el pipeline (variable de repositorio en GitHub, no secreto).
          images: ${{ vars.DOCKERHUB_REPO }}
          # 1.0.0 -> 1.0.0, 1.0, 1 ; "latest" solo se añade para tags estables (sin -rc, -beta, etc.)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construye primero solo para linux/amd64, cargado localmente, para poder escanearla
      # con Trivy antes de publicar nada multiarquitectura.
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: scan-target:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for critical vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:latest
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
