# Entorno de PRODUCCIÓN. Usa la imagen publicada en Docker Hub (construida por el
# Dockerfile de este repositorio y subida por el pipeline de CI al crear un tag v*.*.*).
#
# Despliegue (ver también el README, sección "Despliegue"):
#   1. docker login                         (si el repositorio de Docker Hub es privado)
#   2. cp .env.example .env  y llenar las variables, generar APP_KEY
#   3. docker compose -f docker-compose.prod.yml up -d
#   4. docker compose -f docker-compose.prod.yml exec app php artisan app:crear-admin correo@dominio

services:
  app:
    image: ${DOCKERHUB_REPO:-organizacion/seguimiento-estudiantes}:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # PHP-FPM: 5 workers por defecto se saturaban con pocos usuarios
      # simultáneos (las peticiones hacían cola). 25 workers con 31 GB de RAM
      # deja margen de sobra (~50 MB por worker).
      PHP_FPM_PM_CONTROL: dynamic
      PHP_FPM_PM_MAX_CHILDREN: "25"
      PHP_FPM_PM_START_SERVERS: "5"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "3"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "8"
      PHP_FPM_PM_MAX_REQUESTS: "500"
    volumes:
      - storage_data:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - internal
      - public

  queue:
    image: ${DOCKERHUB_REPO:-organizacion/seguimiento-estudiantes}:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: "false"
    volumes:
      - storage_data:/var/www/html/storage/app
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    image: ${DOCKERHUB_REPO:-organizacion/seguimiento-estudiantes}:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: "false"
    volumes:
      - storage_data:/var/www/html/storage/app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Ajustes de rendimiento: el buffer pool por defecto (128 MB) es pequeño y
    # las tablas temporales se quedaban en disco. La durabilidad (flush=1) se
    # mantiene intacta.
    command:
      - --innodb-buffer-pool-size=512M
      - --tmp-table-size=64M
      - --max-heap-table-size=64M
      - --max-connections=200
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-seguimiento_estudiantes}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin "ports": MySQL solo es alcanzable desde los demás servicios de este archivo,
    # nunca desde fuera del servidor (sección 9: "Red interna").
    networks:
      - internal

volumes:
  db_data:
  storage_data:
  redis_data:

networks:
  internal:
    internal: true
  public:
